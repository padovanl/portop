version: 2

project_name: portop

before:
  hooks:
    - go mod tidy

builds:
  - id: portop
    main: ./cmd/portop
    binary: portop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w
      - -X github.com/padovanl/portop/internal/cli.Version={{.Version}}

archives:
  - id: tarball
    ids: [portop]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Arch "arm" }}v{{ .Arm }}{{ end }}
    # Windows users (and winget's portable installer) expect a zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

nfpms:
  - id: packages
    ids: [portop]
    package_name: portop
    # ARMv6 and ARMv7 both use armhf in DEB metadata; keep filenames distinct.
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Arch "arm" }}v{{ .Arm }}{{ end }}'
    vendor: portop
    homepage: https://github.com/padovanl/portop
    maintainer: Luca Padovan <padovan.93@gmail.com>
    description: >-
      TUI in stile htop per vedere quali processi stanno davvero usando
      le porte TCP/UDP del sistema.
    license: MIT
    formats:
      - deb
      - rpm
    section: net
    priority: optional
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/portop/README.md
      - src: LICENSE
        dst: /usr/share/doc/portop/LICENSE

checksum:
  name_template: "checksums.txt"

# Opens a pull request against microsoft/winget-pkgs on every release.
# Needs a fork of winget-pkgs under padovanl and a WINGET_GITHUB_TOKEN
# secret (classic PAT with public_repo); without the token the upload is
# skipped and the manifests are only written to dist/.
winget:
  - name: portop
    package_identifier: padovanl.portop
    publisher: Luca Padovan
    publisher_url: https://github.com/padovanl
    author: Luca Padovan
    short_description: htop-style TUI that shows what is really using your TCP/UDP ports.
    description: >-
      portop is a live terminal UI that lists listening and established
      TCP/UDP sockets with the owning process, Windows service or Docker
      container, CPU usage and a one-key way to open, inspect or end the
      process.
    homepage: https://padovanl.github.io/portop/
    license: MIT
    license_url: https://github.com/padovanl/portop/blob/main/LICENSE
    copyright: Copyright (c) Luca Padovan
    release_notes_url: https://github.com/padovanl/portop/releases/tag/{{ .Tag }}
    tags:
      - ports
      - network
      - tui
      - netstat
      - cli
    ids: [tarball]
    commit_author:
      name: Luca Padovan
      email: padovan.93@gmail.com
    skip_upload: '{{ if not (isEnvSet "WINGET_GITHUB_TOKEN") }}true{{ end }}'
    repository:
      owner: padovanl
      name: winget-pkgs
      branch: "portop-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

release:
  github:
    owner: padovanl
    name: portop
  name_template: "portop {{ .Tag }}"
  # scripts/release.sh stores the release notes in the annotated tag's
  # message body; they go above the generated changelog.
  header: |
    {{ .TagBody }}
  draft: false
  prerelease: auto
