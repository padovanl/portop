name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 scripts/test-install.py
      - run: go vet ./...
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files need gofmt:"
            echo "$fmt_out"
            exit 1
          fi

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -p 1 -count=1 ./...

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=e2e -count=1 ./e2e/...

  release-dry-run:
    name: release dry-run (proof of release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
      - name: verify expected artifacts were produced
        run: |
          set -e
          for arch in amd64 arm64 armv6 armv7; do
            ls dist/*_linux_${arch}.tar.gz
            ls dist/*_linux_${arch}.deb dist/*_linux_${arch}.rpm
          done
          for arch in amd64 arm64; do
            ls dist/*_darwin_${arch}.tar.gz
          done
      - name: Install ARM emulators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Exercise ARM release binaries against real sockets
        run: python3 scripts/test-arm.py dist

  macos:
    name: macOS tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -p 1 -count=1 ./...
      - run: go test -tags=e2e -count=1 ./e2e/...
