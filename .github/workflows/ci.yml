name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/test-install.py
      - run: go vet ./...
      # Same toolchain as the release builds (go.mod), for every target OS.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for os in linux darwin windows; do
            echo "::group::GOOS=$os"
            GOOS=$os "$(go env GOPATH)/bin/govulncheck" ./...
            echo "::endgroup::"
          done
      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files need gofmt:"
            echo "$fmt_out"
            exit 1
          fi

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race -p 1 -count=1 ./...

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -tags=e2e -count=1 ./e2e/...

  release-dry-run:
    name: release dry-run (proof of release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean
      - name: verify expected artifacts were produced
        run: |
          set -e
          for arch in amd64 arm64 armv6 armv7; do
            ls dist/*_linux_${arch}.tar.gz
            ls dist/*_linux_${arch}.deb dist/*_linux_${arch}.rpm
          done
          for arch in amd64 arm64; do
            ls dist/*_darwin_${arch}.tar.gz
          done
          for arch in amd64 arm64; do
            ls dist/*_windows_${arch}.zip
          done
          ls dist/winget/manifests/p/padovanl/portop/*/padovanl.portop.installer.yaml
      - name: Install ARM emulators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Exercise ARM release binaries against real sockets
        run: python3 scripts/test-arm.py dist

  snap:
    name: snap build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
      - name: Run the packed binary
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo snap connect portop:network-observe
          sudo snap connect portop:system-observe
          portop --version
          portop --json --no-docker > /dev/null

  macos:
    name: macOS tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -p 1 -count=1 ./...
      - run: go test -tags=e2e -count=1 ./e2e/...

  windows:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -p 1 -count=1 ./...
      - run: go test -tags=e2e -count=1 ./e2e/...
