name: Microsoft Store package

# Builds the unsigned .msixbundle to upload to Partner Center, which signs
# Store packages itself. The Release workflow calls it after publishing the
# Windows zips; it can also be run by hand for an existing tag. The bundle
# is kept as a workflow artifact, not attached to the GitHub release,
# because an unsigned package cannot be installed directly.
#
# Repository variables (Settings > Secrets and variables > Actions >
# Variables), copied from Partner Center > Product identity:
#   MSIX_IDENTITY_NAME            Package/Identity/Name
#   MSIX_PUBLISHER                Package/Identity/Publisher (CN=...)
#   MSIX_PUBLISHER_DISPLAY_NAME   Package/Properties/PublisherDisplayName

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.4.0)
        required: true

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Download Windows archives from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*_windows_*.zip" --dir dist
      - name: Build .msixbundle
        shell: pwsh
        run: >-
          ./scripts/build-msix.ps1 -Version $env:TAG -DistDir dist -OutDir dist/msix
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}"
          -Publisher "${{ vars.MSIX_PUBLISHER }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portop-msix-${{ env.TAG }}
          path: dist/msix/*.msixbundle
