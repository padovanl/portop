name: Microsoft Store package

# Builds the unsigned .msixbundle to upload to Partner Center. It runs
# after the Release workflow has published the Windows zips (a release
# created with GITHUB_TOKEN cannot trigger `release: published`, hence
# workflow_run), or by hand for an existing tag. Partner Center signs the package; the bundle is
# kept as a workflow artifact, not attached to the GitHub release,
# because an unsigned package cannot be installed directly.
#
# Repository variables (Settings > Secrets and variables > Actions >
# Variables), copied from Partner Center > Product identity:
#   MSIX_IDENTITY_NAME            Package/Identity/Name
#   MSIX_PUBLISHER                Package/Identity/Publisher (CN=...)
#   MSIX_PUBLISHER_DISPLAY_NAME   Package/Properties/PublisherDisplayName

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v0.4.0)
        required: true

permissions:
  contents: read

jobs:
  msix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      # For a tag push, workflow_run reports the tag as head_branch.
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Download Windows archives from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*_windows_*.zip" --dir dist
      - name: Build .msixbundle
        shell: pwsh
        run: >-
          ./scripts/build-msix.ps1 -Version $env:TAG -DistDir dist -OutDir dist/msix
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}"
          -Publisher "${{ vars.MSIX_PUBLISHER }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portop-msix-${{ env.TAG }}
          path: dist/msix/*.msixbundle
