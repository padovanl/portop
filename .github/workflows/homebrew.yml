name: Homebrew

# Opens the version bump pull request for portop on Homebrew/homebrew-core.
# The Release workflow calls it for every stable tag; it can also be run
# by hand for an existing tag.
#
# Secret HOMEBREW_GITHUB_TOKEN: classic PAT with the repo and workflow
# scopes; the action forks Homebrew/homebrew-core under its owner. Without
# it the job does nothing.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.4.0)
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      COMMITTER_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      DOWNLOAD_URL: https://github.com/padovanl/portop/archive/refs/tags/${{ inputs.tag }}.tar.gz
    steps:
      # The action can compute the checksum itself, but it only accepts a
      # 302 from the GitHub tarball API and gets a 303 when authenticated.
      - name: Checksum of the source tarball
        id: sha
        if: env.COMMITTER_TOKEN != ''
        run: echo "sha256=$(curl -fsSL "$DOWNLOAD_URL" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: mislav/bump-homebrew-formula-action@56a283fa15557e9abaa4bdb63b8212abc68e655c # v3.6
        if: env.COMMITTER_TOKEN != ''
        with:
          formula-name: portop
          formula-path: Formula/p/portop.rb
          tag-name: ${{ env.TAG }}
          download-url: ${{ env.DOWNLOAD_URL }}
          download-sha256: ${{ steps.sha.outputs.sha256 }}
