name: Debian packaging

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  debian:
    name: Debian sid source and binary package
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential debhelper dh-golang golang-any lintian python3
      - uses: actions/checkout@v4
      - name: Install Debian build dependencies
        run: apt-get build-dep -y --no-install-recommends .
      - name: Build source and binary packages
        run: make debian
      - name: Check package policy
        run: lintian --fail-on error dist/debian/*.changes
      - name: Exercise installed package as an ordinary user
        run: |
          apt-get install -y ./dist/debian/portop_*_amd64.deb
          runuser -u nobody -- debian/tests/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: portop-debian-amd64
          path: dist/debian/
