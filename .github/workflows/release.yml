name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Tags are meant to be cut from main only (development happens on
  # develop/feature branches). This refuses the release if someone tags a
  # commit that never made it into main.
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag points at a commit on main
        run: |
          git fetch origin main develop
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; merge to main before tagging a release."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/develop "${GITHUB_SHA}"; then
            echo "::error::Release tag does not include all commits currently on develop."
            exit 1
          fi

  release:
    name: build and publish release
    needs: check-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout can leave the pushed tag as a lightweight ref; refetch it
      # so GoReleaser can read the release notes in its annotation.
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token used to open the winget-pkgs pull request;
          # when the secret is missing the winget upload is skipped.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
