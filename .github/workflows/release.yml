name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Tags are meant to be cut from main only (development happens on
  # develop/feature branches). This refuses the release if someone tags a
  # commit that never made it into main.
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Ensure tag points at a commit on main
        run: |
          git fetch origin main develop
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; merge to main before tagging a release."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/develop "${GITHUB_SHA}"; then
            echo "::error::Release tag does not include all commits currently on develop."
            exit 1
          fi

  release:
    name: build and publish release
    needs: check-branch
    runs-on: ubuntu-latest
    # Write access only where the release is published and attested.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # checkout can leave the pushed tag as a lightweight ref; refetch it
      # so GoReleaser can read the release notes in its annotation.
      - run: git fetch --force --tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token used to open the winget-pkgs pull request;
          # when the secret is missing the winget upload is skipped.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      # Ties every published file to this commit and workflow run; verify
      # with `gh attestation verify <file> --repo padovanl/portop`.
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
      # Makes the Go module proxy fetch the new tag and asks pkg.go.dev to
      # index it, instead of waiting for someone to `go install` it.
      - name: Announce the version to the Go module proxy
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          curl -fsS "https://proxy.golang.org/github.com/padovanl/portop/@v/${GITHUB_REF_NAME}.info"
          curl -sS -X POST --max-time 60 "https://pkg.go.dev/fetch/github.com/padovanl/portop@${GITHUB_REF_NAME}" || true

  # Each store job below is skipped (not failed) while its credentials are
  # missing, so a fresh fork still produces a GitHub release. Pre-release
  # tags (vX.Y.Z-rc1) go to the Snap edge channel only.

  snap:
    name: Snap Store (${{ matrix.arch }})
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # snapcraft export-login --snaps=portop --acls=package_access,package_push,package_update,package_release -
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # snapcraft.yaml takes the version from `git describe --tags`.
      - run: git fetch --force --tags
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ contains(github.ref_name, '-') && 'edge' || 'stable' }}

  # apt.lucapadovan.dev is rebuilt from the GitHub releases by
  # padovanl/packages; this only starts that workflow.
  apt:
    name: APT repository
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      # Fine-grained token with Actions: read and write on padovanl/packages.
      PACKAGES_DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
    steps:
      - if: env.PACKAGES_DISPATCH_TOKEN != ''
        run: gh workflow run publish.yml --repo padovanl/packages
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}

  # The Microsoft Store package is uploaded to Partner Center by hand,
  # from this job's portop-msix-<tag> artifact.
  msix:
    name: Microsoft Store package
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/msix.yml
    with:
      tag: ${{ github.ref_name }}
