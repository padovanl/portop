name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Tags are meant to be cut from main only (development happens on
  # develop/feature branches). This refuses the release if someone tags a
  # commit that never made it into main.
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Ensure tag points at a commit on main
        run: |
          git fetch origin main develop
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main; merge to main before tagging a release."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/develop "${GITHUB_SHA}"; then
            echo "::error::Release tag does not include all commits currently on develop."
            exit 1
          fi

  release:
    name: build and publish release
    needs: check-branch
    runs-on: ubuntu-latest
    # Write access only where the release is published and attested.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # checkout can leave the pushed tag as a lightweight ref; refetch it
      # so GoReleaser can read the release notes in its annotation.
      - run: git fetch --force --tags
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token used to open the winget-pkgs pull request;
          # when the secret is missing the winget upload is skipped.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      # Ties every published file to this commit and workflow run; verify
      # with `gh attestation verify <file> --repo padovanl/portop`.
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
